# Project-scoped Codex configuration for n8n workflow review.
# Codex loads project-scoped .codex/config.toml only when you trust the project.
# Keep your n8n MCP server configured in your user-level ~/.codex/config.toml or add it here if desired.

model = "gpt-5.4"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
